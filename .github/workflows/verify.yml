name: Verify train journey
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        width: [320, 390, 1440]
        motion: ['false', 'true']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm audit
      - run: node verification/check.cjs
        env:
          WIDTHS: ${{ matrix.width }}
          MOTION: ${{ matrix.motion }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium-${{ matrix.width }}-${{ matrix.motion }}
          path: verification/output
